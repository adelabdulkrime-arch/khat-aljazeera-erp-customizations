# Overlay لتشغيل النظام على جهاز داخل الورشة (شبكة محلية، بلا إنترنت).
#
# docker-compose.yml الأساسي مبني لـCoolify، حيث Traefik يستقبل الطلبات ويوجّهها
# داخلياً، ولذلك خدمة frontend تستخدم `expose` فقط بلا منافذ منشورة. على جهاز
# بالورشة ما فيه من يقوم بهذا الدور، فهذا الملف ينشر المنفذ 80 مباشرة على
# الشبكة المحلية لتصل إليه أجهزة الموظفين.
#
# لا يوجد HTTPS هنا عن قصد: الشهادة تحتاج دوميناً عاماً، والبيانات لا تغادر
# شبكة الورشة أصلاً. لا تستخدم هذا الملف لتعريض النظام للإنترنت — راجع
# LOCAL_DEPLOY.md القسم 9.
#
# الاستخدام (لاحظ -f مرتين، والترتيب مهم):
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build

services:
  frontend:
    ports:
      - "80:8080"

  # websocket يُستخدم للإشعارات الفورية وتحديث القوائم دون إعادة تحميل.
  # nginx داخل frontend يمرّر إليه داخلياً، فلا يحتاج منفذاً منشوراً.
