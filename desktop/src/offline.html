<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>لا يوجد اتصال</title>
<style>
  :root { --navy:#1a2b4a; --ink:#e8edf7; --muted:#9fb0cc; --accent:#f0b429; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--navy); color:var(--ink); text-align:center; padding:24px;
    font-family:"Segoe UI",Tahoma,sans-serif;
  }
  .box { max-width:460px; }
  .mark {
    width:88px; height:88px; margin:0 auto 24px; border-radius:22px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; font-weight:700; color:var(--accent);
  }
  h1 { font-size:24px; margin:0 0 12px; font-weight:600; }
  p { color:var(--muted); line-height:1.8; margin:0 0 8px; font-size:15px; }
  .server { font-size:13px; color:var(--muted); direction:ltr; word-break:break-all; margin:18px 0 26px; opacity:.75; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:15px; padding:11px 26px; border-radius:10px;
    border:1px solid transparent; cursor:pointer; transition:filter .15s, background .15s;
  }
  button:hover { filter:brightness(1.12); }
  .primary { background:var(--accent); color:#1a2b4a; font-weight:600; }
  .ghost { background:transparent; color:var(--muted); border-color:rgba(255,255,255,.2); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">خط</div>
    <h1>لا يمكن الوصول إلى النظام</h1>
    <p>تأكد من اتصالك بالإنترنت، ومن أن سيرفر النظام يعمل.</p>
    <div class="server" id="server"></div>
    <div class="row">
      <button class="primary" id="retry">إعادة المحاولة</button>
      <button class="ghost" id="settings">تغيير عنوان السيرفر</button>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('server').textContent = params.get('server') || '';
  document.getElementById('retry').addEventListener('click', () => window.khat.retry());
  document.getElementById('settings').addEventListener('click', () => window.khat.openSettings());
</script>
</body>
</html>
