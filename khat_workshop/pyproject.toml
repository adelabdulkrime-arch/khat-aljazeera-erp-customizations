[project]
name = "khat_workshop"
authors = [
    { name = "Khat Al Jazeera" },
]
description = "Khat Al Jazeera vehicle-workshop customisations for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
