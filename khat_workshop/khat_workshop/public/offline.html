<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>لا يوجد اتصال — خط الجزيرة</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			text-align: center;
			font-family: "Tahoma", "Segoe UI", system-ui, -apple-system, sans-serif;
			color: #f5f7fa;
			background: linear-gradient(160deg, #1a2b4a 0%, #0f1b33 100%);
		}
		.card { max-width: 360px; }
		img { width: 96px; height: 96px; margin-bottom: 22px; }
		h1 { font-size: 1.35rem; margin: 0 0 12px; }
		p { color: #b7c0d4; line-height: 1.8; margin: 0 0 26px; }
		button {
			background: #e63946;
			color: #fff;
			border: 0;
			border-radius: 10px;
			padding: 12px 30px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { background: #cb2929; }
	</style>
</head>
<body>
	<div class="card">
		<img src="/assets/khat_workshop/icons/icon-192.png" alt="خط الجزيرة">
		<h1>لا يوجد اتصال بالإنترنت</h1>
		<p>يتعذّر الوصول إلى النظام حالياً. تأكّد من اتصالك بالشبكة ثم أعد المحاولة.</p>
		<button onclick="location.reload()">إعادة المحاولة</button>
	</div>
</body>
</html>
