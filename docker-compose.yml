services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 15s
      retries: 10
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    volumes:
      - redis-queue-data:/data

  # ── One-time: write common_site_config.json ───────────────────────────────
  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        bench set-config -g db_host $$DB_HOST
        bench set-config -gp db_port $$DB_PORT
        bench set-config -g redis_cache "redis://$$REDIS_CACHE"
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
        bench set-config -gp socketio_port $$SOCKETIO_PORT
        echo "configurator: done"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy

  # ── One-time: create site + apply all workshop customisations ─────────────
  init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-v16}
    restart: "no"
    entrypoint: ["bash", "/opt/init.sh"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SITE_NAME: ${SITE_NAME:-erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ── Backend (gunicorn) ────────────────────────────────────────────────────
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  # ── Frontend (nginx) — Coolify/Traefik routes to port 8080 ───────────────
  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    # Strip any http(s):// scheme and trailing path from the site header before
    # handing off to nginx. Frappe rejects a site name containing a scheme, so
    # this makes the container robust even if SITE_NAME is set to a full URL.
    # $$ escapes to a literal $ so the shell (not compose) does the expansion.
    entrypoint: ["bash", "-c"]
    command:
      - |
        H="$$FRAPPE_SITE_NAME_HEADER"
        H="$${H#http://}"; H="$${H#https://}"; H="$${H%%/*}"
        export FRAPPE_SITE_NAME_HEADER="$$H"
        echo "frontend: FRAPPE_SITE_NAME_HEADER=$$FRAPPE_SITE_NAME_HEADER"
        exec nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.local}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: "127.0.0.1"
      UPSTREAM_REAL_IP_HEADER: "X-Forwarded-For"
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    expose:
      - "8080"
    # NOTE: Do NOT declare networks here. Coolify manages the proxy-network
    # attachment via the "Connect To Predefined Network" toggle (Configuration
    # → Advanced), which adds the `coolify` network to every service on deploy.
    # Declaring networks in this file conflicts with Coolify's own network
    # generation and breaks the deploy.
    depends_on:
      backend:
        condition: service_started

  # ── WebSocket (Socket.io) ─────────────────────────────────────────────────
  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  # ── Workers ───────────────────────────────────────────────────────────────
  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench worker --queue short,default
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench worker --queue long
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench schedule
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
