services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 15s
      retries: 10
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    volumes:
      - redis-queue-data:/data

  # ── One-time: write common_site_config.json ───────────────────────────────
  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        bench set-config -g db_host $$DB_HOST
        bench set-config -gp db_port $$DB_PORT
        bench set-config -g redis_cache "redis://$$REDIS_CACHE"
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
        bench set-config -gp socketio_port $$SOCKETIO_PORT
        echo "configurator: done"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy

  # ── One-time: create site + apply all workshop customisations ─────────────
  init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-v16}
    restart: "no"
    entrypoint: ["bash", "/opt/init.sh"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SITE_NAME: ${SITE_NAME:-erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ── Backend (gunicorn) ────────────────────────────────────────────────────
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  # ── Frontend (nginx) — Coolify/Traefik routes to port 8080 ───────────────
  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    # Strip any http(s):// scheme and trailing path from the site header before
    # handing off to nginx. Frappe rejects a site name containing a scheme, so
    # this makes the container robust even if SITE_NAME is set to a full URL.
    # $$ escapes to a literal $ so the shell (not compose) does the expansion.
    entrypoint: ["bash", "-c"]
    command:
      - |
        H="$$FRAPPE_SITE_NAME_HEADER"
        H="$${H#http://}"; H="$${H#https://}"; H="$${H%%/*}"
        export FRAPPE_SITE_NAME_HEADER="$$H"
        echo "frontend: FRAPPE_SITE_NAME_HEADER=$$FRAPPE_SITE_NAME_HEADER"
        exec nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.local}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: "127.0.0.1"
      UPSTREAM_REAL_IP_HEADER: "X-Forwarded-For"
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    expose:
      - "8080"
    # No manual `networks:` here. In managed compose mode Coolify puts every
    # service on the per-stack network and attaches Traefik to it, so the proxy
    # can already reach frontend:8080. Declaring extra networks multi-homes the
    # container; with no `traefik.docker.network` label Traefik then guesses an
    # IP and can pick one it has no route to → intermittent ERR_CONNECTION_RESET.
    depends_on:
      backend:
        condition: service_started

  # ── WebSocket (Socket.io) ─────────────────────────────────────────────────
  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  # ── Workers ───────────────────────────────────────────────────────────────
  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench worker --queue short,default
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench worker --queue long
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    command: bench schedule
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      init:
        condition: service_completed_successfully

  # ── Automated backups ─────────────────────────────────────────────────────
  # Frappe's scheduler does NOT create backups. In a normal bench install that
  # job is a HOST cron entry, which simply does not exist inside containers —
  # so a containerised deploy silently has no backups at all until you add
  # something like this. Verified on the server: the backups directory was
  # empty and the only backup-related scheduled job was the one that DELETES
  # downloadable backups.
  #
  # Backups are written to a SEPARATE volume (not the sites volume) so that
  # losing/corrupting the site data does not take the backups with it.
  backup:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        RETENTION_DAYS="$${BACKUP_RETENTION_DAYS:-14}"
        INTERVAL="$${BACKUP_INTERVAL_SECONDS:-86400}"
        echo "[backup] loop start — every $${INTERVAL}s, keeping $${RETENTION_DAYS} days"
        while true; do
          SITE="$$(cat sites/currentsite.txt 2>/dev/null)"
          if [ -n "$$SITE" ]; then
            echo "[backup] $$(date -u '+%Y-%m-%dT%H:%M:%SZ') backing up $$SITE"
            if bench --site "$$SITE" backup --with-files --backup-path /backups; then
              echo "[backup] OK"
              # Prune anything older than the retention window.
              find /backups -type f -mtime "+$${RETENTION_DAYS}" -delete 2>/dev/null || true
            else
              echo "[backup] FAILED for $$SITE"
            fi
          else
            echo "[backup] currentsite.txt not readable yet — skipping this cycle"
          fi
          sleep "$$INTERVAL"
        done
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - backups:/backups
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
  # Deliberately separate from `sites` so backups survive site-data loss.
  backups:
